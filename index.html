<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First Website</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0D1B3E;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      color: #0D1B3E;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    .emoji { font-size: 56px; }
    h1 { margin: 12px 0 8px; font-size: 28px; }
    p { color: #444; line-height: 1.5; margin-bottom: 24px; }
    a, button {
      display: block;
      width: 100%;
      background: #F28C28;
      color: #0D1B3E;
      text-decoration: none;
      font: inherit;
      font-weight: 600;
      padding: 14px;
      border: none;
      border-radius: 10px;
      margin-bottom: 12px;
      cursor: pointer;
    }
    a:hover, button:hover { opacity: 0.9; }
    form { display: none; text-align: left; margin-top: 4px; }
    form.open { display: block; }
    input, textarea {
      width: 100%;
      font: inherit;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 10px;
      color: #0D1B3E;
    }
    textarea { min-height: 110px; resize: vertical; }
    .hp { display: none; }
    #status { text-align: center; font-size: 14px; margin: 4px 0 0; }
    footer { margin-top: 20px; font-size: 13px; color: #888; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🚀</div>
    <h1>Ted Sung</h1>
    <p>Using AI to build enterprise workloads<br>and creative side projects.</p>
    <a href="https://www.linkedin.com/in/tedsung" target="_blank">LinkedIn</a>
    <button type="button" id="contact-toggle">Contact me</button>
    <form id="contact-form" action="https://formspree.io/f/xaeobgyr" method="POST">
      <input type="text" name="name" placeholder="Your name" required />
      <input type="email" name="email" placeholder="Your email" required />
      <textarea name="message" placeholder="Your message" required></textarea>
      <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" />
      <button type="submit">Send</button>
      <p id="status"></p>
    </form>
    <footer>Build with AI - Startup UCLA</footer>
  </div>
  <script>
    const form = document.getElementById('contact-form');
    const status = document.getElementById('status');
    document.getElementById('contact-toggle').addEventListener('click', () => {
      form.classList.toggle('open');
    });
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.textContent = 'Sending...';
      try {
        const res = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { Accept: 'application/json' }
        });
        if (res.ok) {
          form.reset();
          status.textContent = 'Thanks! Your message was sent.';
        } else {
          status.textContent = 'Something went wrong. Please try again.';
        }
      } catch {
        status.textContent = 'Something went wrong. Please try again.';
      }
    });
  </script>
</body>
</html>
